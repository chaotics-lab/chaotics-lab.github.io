<style>

9.5 317.3 C 202.8 332.6, 217.3 339.7, 237.5 336 C 240.3 335.5, 244.6 334.7, 247.3 334.4 C 249.9 334, 252 333.3, 252 332.9 C 252 332.4, 253.8 332, 256 332 C 258.2 332, 260 332.4, 260 332.9 C 260 333.3, 262.1 334, 264.8 334.4 C 267.4 334.7, 271.8 335.5, 274.5 336 C 294.7 339.7, 309.2 332.6, 312.5 317.3 C 312.8 315.5, 313.5 314, 314 314 C 314.5 314, 315.1 311, 315.5 307.3 C 317.2 289.8, 321 277.7, 326.7 271.2 C 330.3 267.3, 333.3 255.8, 332.8 248.7 C 331.8 236.3, 324.7 228.6, 307.8 221.6 C 303 219.7, 298.3 217.4, 297.3 216.6 C 296.3 215.8, 292.9 213, 289.8 210.4 C 286.6 207.9, 284 205.3, 284 204.7 C 284 203.3, 275.9 195, 274.5 195 C 274 195, 272 193.7, 270.2 192.1 C 265.1 187.5, 257.1 186.2, 248.9 188.4';
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
// ---- value noise (smooth, 2D + time) ----
const perm = new Uint8Array(512); { const p = [...Array(256).keys()].sort(() => Math.random() - 0.5); for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
const grad = (h, x, y) => { const a = (h / 256) * TAU; return Math.cos(a) * x + Math.sin(a) * y; };
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
function noise(x, y) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255; x -= Math.floor(x); y -= Math.floor(y);
  const u = fade(x), v = fade(y), a = perm[X] + Y, b = perm[X + 1] + Y;
  const l1 = grad(perm[a], x, y) + u * (grad(perm[b], x - 1, y) - grad(perm[a], x, y));
  const l2 = grad(perm[a + 1], x, y - 1) + u * (grad(perm[b + 1], x - 1, y - 1) - grad(perm[a + 1], x, y - 1));
  return l1 + v * (l2 - l1);
}
// curl of a scalar potential: divergence-free swirling flow
function curl(x, y, t) {
  const e = 0.01, n = (a, b) => noise(a + t * 0.07, b - t * 0.05);
  return [(n(x, y + e) - n(x, y - e)) / (2 * e), -(n(x + e, y) - n(x - e, y)) / (2 * e)];
}

const FX = {};

// ---- VOLTA: midpoint-displacement bolts, branch, flicker once, fade ----
FX.volta = () => {
  let bolts = [], next = 0.4, flash = 0;
  const bolt = boltSegs;
  function strike(w, h, x, y) {
    const x0 = x ?? rnd(w * 0.15, w * 0.85), y0 = y ?? rnd(h * 0.1, h * 0.5);
    const ang = rnd(-0.9, 0.9) + Math.PI / 2, L = rnd(h * 0.3, h * 0.55);
    const make = () => { const segs = []; bolt(x0, y0, x0 + Math.cos(ang) * L, y0 + Math.sin(ang) * L, L * 0.28, 6, segs, 2.4); return segs; };
    bolts.push({ segs: make(), make, age: 0, life: 0.6, flicked: false });
    flash = 1;
  }
  return {
    click: (w, h, x, y) => strike(w, h, x, y),
    draw(g, w, h, dt) {
      if ((next -= dt) <= 0) { next = rnd(1, 2.4); strike(w, h); }
      flash *= Math.pow(0.002, dt);
      if (flash > 0.01) { g.fillStyle = `rgba(255,255,255,${0.06 * flash})`; g.fillRect(0, 0, w, h); }
      g.lineCap = 'round'; g.lineJoin = 'round';
      bolts = bolts.filter(b => (b.age += dt) < b.life);
      for (const b of bolts) {
        const k = b.age / b.life;
        if (!b.flicked && k > 0.25) { b.segs = b.make(); b.flicked = true; } // re-seeded once: the flicker
        const a = k < 0.08 ? 1 : 1 - (k - 0.08) / 0.92;
        g.strokeStyle = `rgba(255,255,255,${a})`;
        for (const s of b.segs) {
          g.lineWidth = s.width * (1 - k * 0.6);
          g.beginPath(); g.moveTo(...s.pts[0]); for (const p of s.pts) g.lineTo(...p); g.stroke();
        }
      }
    },
  };
};

// midpoint displacement: split each segment, push the midpoint sideways, halve the spread, repeat; then branch
function boltSegs(x0, y0, x1, y1, spread, depth, out, width) {
  let pts = [[x0, y0], [x1, y1]];
  for (let d = 0; d < depth; d++) {
    const nxt = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const nx = -(by - ay), ny = bx - ax, len = Math.hypot(nx, ny) || 1;
      const off = rnd(-spread, spread);
      nxt.push([(ax + bx) / 2 + (nx / len) * off, (ay + by) / 2 + (ny / len) * off], pts[i + 1]);
    }
    pts = nxt; spread /= 2;
  }
  out.push({ pts, width });
  // branches from a few points, shorter, thinner, angled off the trunk
  if (width > 1) for (let k = 0; k < 2; k++) {
    const i = Math.floor(rnd(pts.length * 0.2, pts.length * 0.8)), [bx, by] = pts[i];
    const ang = Math.atan2(y1 - y0, x1 - x0) + rnd(0.35, 0.8) * (Math.random() < 0.5 ? -1 : 1);
    const L = Math.hypot(x1 - x0, y1 - y0) * rnd(0.2, 0.4);
    boltSegs(bx, by, bx + Math.cos(ang) * L, by + Math.sin(ang) * L, L * 0.25, depth - 1, out, width * 0.5);
  }
}

// fractal noise in [-1, 1]ish, a few octaves
const fbm = (x, y, oct = 3) => { let s = 0, a = 1, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * noise(x * f, y * f); n += a; a *= 0.5; f *= 2; } return s / n; };

// ---- VOLTA B/C: ArvidW's flash, in 2D. A soft glow, kept only where a murk texture is dense, added on top.
// Same flicker rule as the pen: a flash starts at random; while it is bright its power is re-rolled every
// frame (so it stutters and stays on a few frames); below the threshold it dies out.
function murkTexture(seed) {
  const W = 160, H = 120, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), img = x.createImageData(W, H);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const n = fbm(i / 38 + seed, j / 30 + seed * 1.7, 4), a = Math.max(0, Math.min(1, (n + 0.15) * 2.2));
    const o = (j * W + i) * 4; img.data[o] = img.data[o + 1] = img.data[o + 2] = 255; img.data[o + 3] = a * 255;
  }
  x.putImageData(img, 0, 0); return c;
}
const voltaFlash = withBolts => () => {
  const murk = [murkTexture(3.1), murkTexture(17.4)], off = document.createElement('canvas'), o = off.getContext('2d');
  let power = 0, fx = 0, fy = 0, t = 0, bolts = [];
  const RATE = 0.9; // flashes per second (the pen: about 4)
  const start = (w, h, x, y) => {
    fx = x ?? rnd(w * 0.1, w * 0.9); fy = y ?? rnd(h * 0.05, h * 0.6);
    power = 300 + Math.random() * 250;
    if (withBolts) { const segs = [], ang = Math.PI / 2 + rnd(-0.7, 0.7), L = rnd(h * 0.25, h * 0.45); boltSegs(fx, fy, fx + Math.cos(ang) * L, fy + Math.sin(ang) * L, L * 0.28, 6, segs, 2); bolts = [{ segs, age: 0 }]; }
  };
  return {
    click: (w, h, x, y) => start(w, h, x, y),
    draw(g, w, h, dt) {
      t += dt;
      if (power < 100 && Math.random() < RATE * dt) start(w, h);
      else if (power > 100) power = 50 + Math.random() * 500; // the stutter
      else power *= Math.pow(0.02, dt);
      // murk drifts and turns slowly, two layers the other way round (the pen's rotating clouds)
      const ow = Math.ceil(w / 2), oh = Math.ceil(h / 2);
      if (off.width !== ow) { off.width = ow; off.height = oh; }
      const a = Math.min(1, power / 550);
      if (a > 0.01) {
        o.globalCompositeOperation = 'source-over'; o.clearRect(0, 0, ow, oh);
        murk.forEach((m, i) => { o.save(); o.translate(ow / 2, oh / 2); o.rotate((i ? -1 : 1) * t * 0.03); o.drawImage(m, -ow * 0.8, -oh * 0.8, ow * 1.6, oh * 1.6); o.restore(); });
        o.globalCompositeOperation = 'source-in';
        const R = Math.max(ow, oh) * 0.7, gr = o.createRadialGradient(fx / 2, fy / 2, 0, fx / 2, fy / 2, R);
        gr.addColorStop(0, `rgba(191,244,255,${a})`); gr.addColorStop(0.45, `rgba(22,207,251,${0.55 * a})`); gr.addColorStop(1, 'rgba(22,207,251,0)');
        o.fillStyle = gr; o.fillRect(0, 0, ow, oh);
        g.globalCompositeOperation = 'lighter'; g.drawImage(off, 0, 0, w, h); g.globalCompositeOperation = 'source-over';
      }
      if (withBolts) {
        bolts = bolts.filter(b => (b.age += dt) < 0.5);
        g.lineCap = 'round'; g.lineJoin = 'round';
        for (const b of bolts) {
          g.strokeStyle = `rgba(255,255,255,${Math.max(a, 1 - b.age / 0.5) * (1 - b.age / 0.5)})`;
          for (const s of b.segs) { g.lineWidth = s.width; g.beginPath(); g.moveTo(...s.pts[0]); for (const p of s.pts) g.lineTo(...p); g.stroke(); }
        }
      }
    },
  };
};
FX.voltaFlash = voltaFlash(false);
FX.voltaFlashBolts = voltaFlash(true);

// ---- GAIA: drifting contour lines of a noise field (marching squares) + falling dust ----
FX.gaia = () => {
  let dust = [], t = 0, push = null;
  const LEVELS = [-0.25, -0.12, 0, 0.12, 0.25];
  return {
    click: (w, h, x, y) => { for (let i = 0; i < 14; i++) dust.push({ x: x + rnd(-10, 10), y: y + rnd(-6, 6), vx: rnd(-40, 40), vy: rnd(-60, -10), r: rnd(0, TAU), s: rnd(2, 4.5), age: 0 }); push = { x, y, t: 0 }; },
    draw(g, w, h, dt) {
      t += dt;
      const C = 10, cols = Math.ceil(w / C) + 1, rows = Math.ceil(h / C) + 1, f = new Float32Array(cols * rows);
      // stretched horizontally so the contours lie like strata; slow drift
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        let v = noise(i * C * 0.004 + t * 0.03, j * C * 0.016) * 0.9 + noise(i * C * 0.012, j * C * 0.04 + 9) * 0.25;
        if (push) { const d = Math.hypot(i * C - push.x, j * C - push.y); v += 0.25 * Math.exp(-d * d / 2500) * Math.exp(-push.t * 1.5); }
        f[j * cols + i] = v;
      }
      if (push && (push.t += dt) > 3) push = null;
      g.strokeStyle = 'rgba(255,255,255,0.28)'; g.lineWidth = 1.2;
      g.beginPath();
      for (const L of LEVELS) for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
        const a = f[j * cols + i], b = f[j * cols + i + 1], c = f[(j + 1) * cols + i + 1], d = f[(j + 1) * cols + i];
        const code = (a > L ? 8 : 0) | (b > L ? 4 : 0) | (c > L ? 2 : 0) | (d > L ? 1 : 0);
        if (code === 0 || code === 15) continue;
        const x = i * C, y = j * C, lerp = (p, q) => (L - p) / (q - p);
        const T = [x + C * lerp(a, b), y], R = [x + C, y + C * lerp(b, c)], B = [x + C * lerp(d, c), y + C], Lf = [x, y + C * lerp(a, d)];
        const seg = { 1: [Lf, B], 2: [B, R], 3: [Lf, R], 4: [T, R], 5: [Lf, T, B, R], 6: [T, B], 7: [Lf, T], 8: [Lf, T], 9: [T, B], 10: [Lf, B, T, R], 11: [T, R], 12: [Lf, R], 13: [B, R], 14: [Lf, B] }[code];
        for (let k = 0; k < seg.length; k += 2) { g.moveTo(...seg[k]); g.lineTo(...seg[k + 1]); }
      }
      g.stroke();
      if (Math.random() < dt * 6) dust.push({ x: rnd(0, w), y: -6, vx: rnd(-6, 6), vy: rnd(14, 30), r: rnd(0, TAU), s: rnd(1.5, 3.5), age: 0 });
      g.fillStyle = 'rgba(255,255,255,0.55)';
      dust = dust.filter(p => { p.age += dt; p.vy += 60 * dt * (p.vy < 25 ? 1 : 0); p.x += p.vx * dt; p.vx *= 0.97; p.y += p.vy * dt; p.r += dt * 2; return p.y < h + 8 && p.age < 9; });
      for (const p of dust) { g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.beginPath(); g.moveTo(0, -p.s); g.lineTo(p.s, p.s * 0.6); g.lineTo(-p.s * 0.8, p.s * 0.7); g.closePath(); g.fill(); g.restore(); }
    },
  };
};

// ---- AERO: particles following curl noise, drawn as fading trails, plus a vortex ----
FX.aero = () => {
  let ps = [], t = 0, vort = null;
  const spawn = (w, h) => ({ x: rnd(-20, w * 0.3), y: rnd(0, h), trail: [], age: 0, life: rnd(2.5, 4.5) });
  return {
    click: (w, h, x, y) => { vort = { x, y, t: 0 }; },
    draw(g, w, h, dt) {
      t += dt;
      while (ps.length < 60) ps.push(spawn(w, h));
      if (vort && (vort.t += dt) > 3.5) vort = null;
      g.lineCap = 'round';
      for (const p of ps) {
        p.age += dt;
        let [vx, vy] = curl(p.x * 0.006, p.y * 0.006, t);
        vx = vx * 40 + 70; vy *= 40; // a steady wind plus the swirl
        if (vort) { const dx = p.x - vort.x, dy = p.y - vort.y, d2 = dx * dx + dy * dy + 400, s = 9000 / d2 * Math.max(0, 1 - vort.t / 3.5); vx += -dy * s * 0.12; vy += dx * s * 0.12; }
        p.x += vx * dt; p.y += vy * dt;
        p.trail.push([p.x, p.y]); if (p.trail.length > 26) p.trail.shift();
        const a = Math.min(1, p.age / 0.4, (p.life - p.age) / 0.6) * 0.5;
        if (a <= 0 || p.trail.length < 2) continue;
        g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = 1.3;
        g.beginPath(); g.moveTo(...p.trail[0]); for (const q of p.trail) g.lineTo(...q); g.stroke();
      }
      ps = ps.filter(p => p.age < p.life && p.x < w + 40);
    },
  };
};

// ---- CRYO: 6-fold branching crystals that grow, hold, crack and fade ----
FX.cryo = () => {
  let xs = [], next = 0.3;
  function make(x, y, R) {
    const arm = [], subs = Math.floor(rnd(2, 4));
    arm.push({ a: 0, l: R, from: 0 });
    for (let i = 1; i <= subs; i++) { const at = (i / (subs + 1)) * R * rnd(0.85, 1.05), l = R * rnd(0.22, 0.42) * (1 - i / (subs + 2)); arm.push({ a: Math.PI / 3, l, from: at }, { a: -Math.PI / 3, l, from: at }); }
    return { x, y, arm, age: 0, grow: 0.7, hold: 1.1, crack: 0.5, rot: rnd(0, TAU), cracks: [...Array(18)].map(() => [rnd(-3, 3), rnd(-3, 3), Math.random() < 0.35]) };
  }
  return {
    click: (w, h, x, y) => xs.push(make(x, y, rnd(26, 44))),
    draw(g, w, h, dt) {
      if ((next -= dt) <= 0) { next = rnd(0.6, 1.4); xs.push(make(rnd(30, w - 30), rnd(40, h - 30), rnd(14, 34))); }
      g.lineCap = 'round';
      xs = xs.filter(c => (c.age += dt) < c.grow + c.hold + c.crack);
      for (const c of xs) {
        const gk = Math.min(1, c.age / c.grow), ck = Math.max(0, (c.age - c.grow - c.hold) / c.crack);
        const eased = 1 - Math.pow(1 - gk, 3);
        g.strokeStyle = `rgba(255,255,255,${0.9 * (1 - ck)})`; g.lineWidth = 1.6;
        for (let s = 0; s < 6; s++) {
          const base = c.rot + (s * Math.PI) / 3;
          c.arm.forEach((b, bi) => {
            const reach = eased * c.arm[0].l; if (b.from > reach) return;
            const grow = Math.min(1, (reach - b.from) / (b.l || 1)) * (bi === 0 ? 1 : 1);
            const L = bi === 0 ? reach : b.l * grow;
            const cr = c.cracks[(s * 3 + bi) % c.cracks.length];
            if (ck > 0 && cr[2] && ck > 0.3) return; // cracked pieces drop out
            const ox = ck * cr[0] * 3, oy = ck * cr[1] * 3;
            const sx = c.x + Math.cos(base) * b.from + ox, sy = c.y + Math.sin(base) * b.from + oy;
            const ang = base + b.a;
            g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(ang) * L, sy + Math.sin(ang) * L); g.stroke();
          });
        }
      }
    },
  };
};

// ---- PYRA: embers rising along curl noise, flickering white -> accent -> out; thin heat lines ----
FX.pyra = () => {
  let es = [], t = 0, heat = [], nextHeat = 1;
  const add = (x, y, n, burst) => {
    for (let i = 0; i < n; i++) {
      const a = rnd(-Math.PI, 0), v = rnd(60, 170);
      es.push({ x: x + rnd(-6, 6), y, vy: burst ? Math.sin(a) * v : rnd(-40, -18), vx: burst ? Math.cos(a) * v : 0, age: 0, life: rnd(1.6, 3.2), s: rnd(1.6, 3), ph: rnd(0, TAU) });
    }
  };
  return {
    click: (w, h, x, y) => add(x, y, 24, true),
    draw(g, w, h, dt) {
      t += dt;
      if (Math.random() < dt * 10) add(rnd(0, w), h + 4, 1);
      es = es.filter(e => (e.age += dt) < e.life);
      for (const e of es) {
        const [cx, cy] = curl(e.x * 0.01, e.y * 0.01, t);
        // burst speed bleeds off, then buoyancy takes over
        e.vx = e.vx * Math.pow(0.15, dt) + cx * 180 * dt; e.vy = e.vy * Math.pow(0.3, dt) + (-30 - e.vy) * 0.6 * dt;
        const px = e.x, py = e.y; e.x += e.vx * dt; e.y += (e.vy + cy * 10) * dt;
        const k = e.age / e.life, fl = 0.6 + 0.4 * Math.sin(e.age * 22 + e.ph);
        const a = Math.min(1, e.age / 0.15) * (1 - k) * fl;
        // a short streak along the motion, at least a dot
        const dx = e.x - px, dy = e.y - py, L = Math.hypot(dx, dy) || 1, len = Math.max(e.s, Math.min(14, L * 4));
        g.strokeStyle = k < 0.35 ? `rgba(255,255,255,${a})` : `rgba(22,207,251,${a})`; // white -> accent
        g.lineWidth = e.s * 0.7; g.lineCap = 'round';
        g.beginPath(); g.moveTo(e.x - (dx / L) * len, e.y - (dy / L) * len); g.lineTo(e.x, e.y); g.stroke();
      }
      // heat: a few wavy horizontal strokes that rise and fade (cheap stand-in for a displacement filter)
      if ((nextHeat -= dt) <= 0) { nextHeat = rnd(1.2, 2.5); heat.push({ y: rnd(h * 0.5, h), age: 0, life: 1.8, ph: rnd(0, TAU) }); }
      heat = heat.filter(hl => (hl.age += dt) < hl.life);
      g.lineWidth = 1;
      for (const hl of heat) {
        const k = hl.age / hl.life, y = hl.y - k * 60;
        g.strokeStyle = `rgba(255,255,255,${0.22 * Math.sin(Math.PI * k)})`;
        g.beginPath(); for (let x = 0; x <= w; x += 8) { const yy = y + Math.sin(x * 0.05 + hl.ph + t * 6) * 3; x ? g.lineTo(x, yy) : g.moveTo(x, yy); } g.stroke();
      }
    },
  };
};

// ---- FLORA: space-colonization vine grown offscreen, revealed tip by tip, flowers at the ends, fade ----
const FLORA = new Path2D(FLORA_PATH);
FX.flora = () => {
  let vines = [], next = 0.2;
  function grow(x0, y0, h) {
    // attractors fill a leaning crown above the trunk, none beside it
    const cx = x0 + rnd(-0.15, 0.15) * h, cy = y0 - h * 0.6, rx = h * rnd(0.22, 0.32), ry = h * 0.2;
    const att = [...Array(90)].map(() => { const a = rnd(0, TAU), r = Math.sqrt(Math.random()); return [cx + Math.cos(a) * r * rx, cy + Math.sin(a) * r * ry]; });
    const nodes = [{ x: x0, y: y0, p: -1, d: 0 }], STEP = 7, KILL = 10, INF = 80;
    for (let it = 0; it < 130 && att.length; it++) {
      const pull = new Map();
      for (const a of att) { let best = -1, bd = INF; nodes.forEach((n, i) => { const d = Math.hypot(a[0] - n.x, a[1] - n.y); if (d < bd) { bd = d; best = i; } }); if (best >= 0) { const v = pull.get(best) || [0, 0, 0]; v[0] += (a[0] - nodes[best].x) / bd; v[1] += (a[1] - nodes[best].y) / bd; v[2]++; pull.set(best, v); } }
      if (!pull.size) { const n = nodes[nodes.length - 1], dx = cx - n.x, dy = cy - n.y, L = Math.hypot(dx, dy) || 1; nodes.push({ x: n.x + (dx / L) * STEP + Math.sin(it * 0.7) * 1.5, y: n.y + (dy / L) * STEP, p: nodes.length - 1, d: n.d + 1 }); }
      for (const [i, v] of pull) { const L = Math.hypot(v[0], v[1]) || 1, n = nodes[i]; nodes.push({ x: n.x + (v[0] / L) * STEP, y: n.y + (v[1] / L) * STEP, p: i, d: n.d + 1 }); }
      for (let k = att.length - 1; k >= 0; k--) if (nodes.some(n => Math.hypot(att[k][0] - n.x, att[k][1] - n.y) < KILL)) att.splice(k, 1);
    }
    const kids = new Set(nodes.map(n => n.p)); const tips = nodes.filter((n, i) => !kids.has(i) && n.d > 6);
    return { nodes, tips: tips.sort(() => Math.random() - 0.5).slice(0, 4), age: 0, maxD: Math.max(...nodes.map(n => n.d)) };
  }
  return {
    click: (w, h, x, y) => vines.push(grow(x, y, h * 0.6)),
    draw(g, w, h, dt) {
      if ((next -= dt) <= 0) { next = rnd(2.2, 3.4); vines.push(grow(rnd(w * 0.15, w * 0.85), h + 4, h)); }
      vines = vines.filter(v => (v.age += dt) < 4.6);
      g.lineCap = 'round';
      for (const v of vines) {
        const reveal = Math.min(1, v.age / 1.8) * v.maxD, a = v.age < 3.4 ? 1 : 1 - (v.age - 3.4) / 1.2;
        g.strokeStyle = `rgba(255,255,255,${0.8 * a})`;
        for (const n of v.nodes) { if (n.p < 0 || n.d > reveal) continue; const p = v.nodes[n.p]; g.lineWidth = Math.max(0.8, 2.6 * (1 - n.d / v.maxD)); g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(n.x, n.y); g.stroke(); }
        for (const tp of v.tips) {
          const open = Math.max(0, Math.min(1, (reveal - tp.d) / 6 + (v.age - 1.8) * 1.5)); if (open <= 0) continue;
          const s = 16 * open / 512; g.save(); g.translate(tp.x, tp.y); g.rotate(v.age * 0.5); g.scale(s, s); g.translate(-256, -256);
          g.fillStyle = `rgba(255,255,255,${0.2 * a})`; g.fill(FLORA); g.lineWidth = 1.3 / s; g.strokeStyle = `rgba(255,255,255,${a})`; g.stroke(FLORA); g.restore();
        }
      }
    },
  };
};

// ---- AQUA: bubbles as thick white rings with a crescent highlight; pop into an expanding ring ----
FX.aqua = () => {
  let bs = [], pops = [];
  const add = (x, y, n) => { for (let i = 0; i < n; i++) bs.push({ x: x + rnd(-8, 8), y: y + rnd(0, 20), r: rnd(3, 8), vy: rnd(-55, -30), ph: rnd(0, TAU), age: 0, popAt: rnd(0.1, 0.45) }); };
  return {
    click: (w, h, x, y) => add(x, y, 9),
    draw(g, w, h, dt) {
      if (Math.random() < dt * 3) { const x = rnd(w * 0.1, w * 0.9); add(x, h + 10, Math.random() < 0.3 ? 4 : 1); }
      bs = bs.filter(b => {
        b.age += dt; b.y += b.vy * dt; b.x += Math.sin(b.age * 3 + b.ph) * 18 * dt; b.r += dt * 0.6;
        if (b.y < h * b.popAt) { pops.push({ x: b.x, y: b.y, r: b.r, age: 0 }); return false; }
        return true;
      });
      for (const b of bs) {
        g.lineWidth = Math.max(1.4, b.r * 0.35); g.strokeStyle = 'rgba(255,255,255,0.75)';
        g.beginPath(); g.arc(b.x, b.y, b.r, 0, TAU); g.stroke();
        g.lineWidth = Math.max(1, b.r * 0.22); g.strokeStyle = '#fff'; // crescent highlight, top-left
        g.beginPath(); g.arc(b.x, b.y, b.r * 0.55, Math.PI * 1.05, Math.PI * 1.45); g.stroke();
      }
      pops = pops.filter(p => (p.age += dt) < 0.35);
      for (const p of pops) { const k = p.age / 0.35; g.lineWidth = 1.2; g.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`; g.beginPath(); g.arc(p.x, p.y, p.r * (1 + k * 1.8), 0, TAU); g.stroke(); }
    },
  };
};

// ---- AQUA C: TidyCoder's crumple filter, redone on a half-resolution canvas. The pen's noise never
// changes (only the displacement scale breathes 475 -> 199 -> 475 over 7 s), so both noise channels are
// baked once; each frame every pixel looks up where it samples from, and tests the ellipse grid there
// directly (no source image). Click: a local swell of the scale.
FX.aquaBlobs = () => {
  let t = 0, W = 0, H = 0, nx, ny, cv, cx, img, swells = [];
  const COLS = 6, ROWS = 2, GAP = 5, F = 0.06; // F: the pen's 0.03 per pixel, at half resolution
  const setup = (w, h) => {
    W = Math.ceil(w / 2); H = Math.ceil(h / 2); nx = new Float32Array(W * H); ny = new Float32Array(W * H);
    for (let j = 0, k = 0; j < H; j++) for (let i = 0; i < W; i++, k++) { nx[k] = fbm(i * F, j * F, 4); ny[k] = fbm(i * F + 31.7, j * F + 11.3, 4); }
    cv = document.createElement('canvas'); cv.width = W; cv.height = H; cx = cv.getContext('2d'); img = cx.createImageData(W, H);
  };
  return {
    click: (w, h, x, y) => swells.push({ x: x / 2, y: y / 2, age: 0 }),
    draw(g, w, h, dt) {
      t += dt;
      if (W !== Math.ceil(w / 2) || H !== Math.ceil(h / 2)) setup(w, h);
      swells = swells.filter(s => (s.age += dt) < 2.5);
      const S = W * (0.12 + 0.16 * (0.5 + 0.5 * Math.cos(t * TAU / 7)));
      const cw = W / COLS, ch = H / ROWS, rx = cw / 2 - GAP / 2, ry = ch / 2 - GAP / 2, rmin = Math.min(rx, ry), d = img.data;
      for (let j = 0, k = 0; j < H; j++) for (let i = 0; i < W; i++, k++) {
        let s = S;
        for (const sw of swells) { const q = ((i - sw.x) ** 2 + (j - sw.y) ** 2) / (W * W * 0.08); s += W * 0.15 * Math.exp(-q) * Math.sin(Math.PI * sw.age / 2.5); }
        const qx = i + s * nx[k], qy = j + s * ny[k], c = Math.floor(qx / cw), r = Math.floor(qy / ch);
        let a = 0;
        if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
          const ex = (qx - (c + 0.5) * cw) / rx, ey = (qy - (r + 0.5) * ch) / ry;
          a = Math.max(0, Math.min(1, 0.5 - (Math.sqrt(ex * ex + ey * ey) - 1) * rmin)); // soft edge, about a pixel
        }
        const o = k * 4; d[o] = 37; d[o + 1] = 117; d[o + 2] = 221; d[o + 3] = 140 * a;
      }
      cx.putImageData(img, 0, 0);
      g.imageSmoothingEnabled = true; g.drawImage(cv, 0, 0, w, h);
    },
  };
};

// ---- runner ----
const tiles = [...document.querySelectorAll('canvas[data-fx]')].map(c => ({ c, g: c.getContext('2d'), fx: FX[c.dataset.fx](), w: 0, h: 0 }));
const fit = () => tiles.forEach(t => { const r = t.c.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); t.w = r.width; t.h = r.height; t.c.width = r.width * d; t.c.height = r.height * d; t.g.setTransform(d, 0, 0, d, 0, 0); });
fit(); addEventListener('resize', fit);
tiles.forEach(t => t.c.addEventListener('pointerdown', e => { const r = t.c.getBoundingClientRect(); t.fx.click(t.w, t.h, e.clientX - r.left, e.clientY - r.top); }));
let last = performance.now();
const loop = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; for (const t of tiles) { t.g.clearRect(0, 0, t.w, t.h); t.fx.draw(t.g, t.w, t.h, dt); } requestAnimationFrame(loop); };
requestAnimationFrame(loop);
